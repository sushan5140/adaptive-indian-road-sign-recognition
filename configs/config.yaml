project:
  name: adaptive-indian-road-sign-recognition
  version: 0.1.0
  seed: 42

runtime:
  # Retained for compatibility; new code uses device and loader sections below.
  device: auto
  num_workers: 0

reproducibility:
  seed: 42
  deterministic: true

device:
  type: cpu

dataset:
  # Relative to the repository root. Windows extended-length handling is applied
  # by the dataset adapter because some source filenames exceed MAX_PATH.
  root: data/raw/indian_traffic_sign_dataset/Indian-Traffic Sign-Dataset/Images
  # auto, directory, split_directory, csv_manifest, or json_manifest.
  mode: directory
  manifest_path: null
  image_path_column: image_path
  label_column: label
  split_column: split
  split: train
  allowed_extensions:
    - .jpg
    - .jpeg
    - .png
    - .bmp
    - .webp
  convert_to_rgb: true
  # error or skip. Skipping is explicit and is never silent.
  corrupt_image_policy: error
  # error or skip when an explicit class mapping omits a manifest label.
  unknown_label_policy: error
  return_metadata: false
  # Numeric source labels are mapped deterministically; class ID 39 has no images.
  class_mapping_path: outputs/manifests/class_mapping.json
  generated_manifest_dir: outputs/manifests

# Dataset B is an audited candidate source, not the active training dataset.
# These paths describe the manually acquired Zenodo record; registration and
# training code must not write into this source tree.
dataset_b:
  root: data/raw/indian_traffic_vqa
  images_directory: traffic512final
  compact_vqa_csv: traffic_vqa_1085.csv
  full_vqa_csv: traffic_vqa_4341.csv
  audit_output_directory: outputs/dataset_b_audit
  candidate_manifest: outputs/manifests/dataset_b_classification.csv
  class_mapping: outputs/manifests/dataset_b_class_mapping.json
  semantic_alignment: outputs/manifests/cross_dataset_class_alignment.csv
  minimum_class_images: 10
  minimum_independent_groups: 5
  near_duplicate_hamming_distance: 4
split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

model:
  backbone: mobilenetv3_small_100
  # The first real baseline should fine-tune ImageNet weights. This may require
  # network access on first use; tests override this value with false.
  pretrained: true
  num_classes: auto
  dropout: 0.2
  normalize_embeddings: true

input:
  image_size: 224
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]

augmentation:
  # Disabled by default because mirroring may change traffic-sign semantics.
  horizontal_flip_probability: 0.0
  max_rotation_degrees: 5
  brightness: 0.15
  contrast: 0.15

loader:
  batch_size: 32
  num_workers: 0
  pin_memory: false

training:
  epochs: 30
  gradient_clip_norm: null
  label_smoothing: 0.0

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9

scheduler:
  name: cosine
  minimum_learning_rate: 0.000001

checkpoint:
  directory: outputs/checkpoints
  monitor: val_accuracy
  mode: max

evaluation:
  output_directory: outputs/evaluations
  split: test

open_set:
  # Placeholder defaults; these must be calibrated on held-out validation/OOD data.
  # `calibrated` stays false until a measured calibration writes these values, so
  # an assumed threshold can never be reported as a tuned one.
  base_confidence_threshold: 0.70
  prototype_similarity_threshold: 0.75
  # Minimum lead the best prototype must have over the runner-up. 0.0 disables
  # the test; a registry holding one class has no runner-up and skips it.
  prototype_margin: 0.0
  # conservative:       if BOTH sources qualify, reject as unknown/ambiguous.
  # classifier_first:   accept a confident base class, then consult the registry.
  # prototype_priority: a qualifying registered prototype outranks the base head.
  #
  # `conservative` is the configured default because the two raw scores have not
  # been calibrated against each other, so a conflict is not something this
  # system can currently arbitrate honestly. See
  # outputs/open_set/open_set_protocol.md. Switch to one of the ranking
  # strategies only once a conflict rule has itself been calibrated.
  strategy: conservative
  unknown_label: unknown
  calibrated: false
  calibration_reference: null
  prototype_registry_path: artifacts/prototypes/registry.npz

# Few-shot registration of new signs. These bounds are policy, not measurement.
registration:
  # Fewest and most reference photographs accepted for one new sign.
  min_references: 3
  max_references: 32
  # Mean pairwise cosine similarity the reference set must reach. Guards against
  # registering photographs of more than one sign as a single class. Use -1.0 to
  # disable. Not calibrated per backbone.
  min_coherence: 0.30
  # Directories the registry file may never be written inside. Derived prototypes
  # must stay separate from the immutable base dataset.
  protected_roots:
    - data/raw
    - data/downloads

logging:
  level: INFO
  format: json
  output_path: logs/application.log
  runs_directory: outputs/runs
