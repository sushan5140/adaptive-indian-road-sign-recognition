project:
  name: adaptive-indian-road-sign-recognition
  experiment: baseline-v2-real-world
  seed: 42
reproducibility:
  seed: 42
  deterministic: true
device:
  type: cpu
dataset:
  root: data/raw/indian_traffic_vqa
  mode: csv_manifest
  image_path_column: image_path
  label_column: class_name
  split_column: split
  class_mapping_path: outputs/manifests/v2_class_mapping.json
model:
  backbone: mobilenetv3_small_100
  pretrained: true
  num_classes: 17
  dropout: 0.2
input:
  image_size: 224
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]
augmentation:
  horizontal_flip_probability: 0.0
  max_rotation_degrees: 7.0
  brightness: 0.20
  contrast: 0.20
loader:
  batch_size: 32
  num_workers: 0
  pin_memory: false
training:
  epochs: 30
  label_smoothing: 0.05
  class_weight_formula: N / (C * n_c), calculated from v2_train.csv only
  model_selection: validation_macro_f1
  tie_break: higher validation accuracy, then earlier epoch
optimizer:
  name: adamw
  learning_rate: 0.0005
  weight_decay: 0.0001
scheduler:
  name: cosine
  minimum_learning_rate: 0.000001
checkpoint:
  directory: outputs/checkpoints
  monitor: val_macro_f1
  mode: max
evaluation:
  output_directory: outputs/v2_results
  split: test
